services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forma_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: forma_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forma_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: forma_ai_backend
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:password123@postgres:5432/forma_ai
      JWT_SECRET: local_dev_forma_ai_jwt_secret_998877665544332211
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: forma_ai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
